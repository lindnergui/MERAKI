name: Build Flatpak release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-flatpak:
    name: Build Flatpak bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - name: Build Meraki Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/com.github.lindnergui.meraki.yml
          bundle: meraki-${{ github.ref_name }}-x86_64.flatpak
          branch: stable
          cache-key: flatpak-${{ github.sha }}
          verbose: true
          upload-artifact: false
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: meraki-flatpak
          path: meraki-${{ github.ref_name }}-x86_64.flatpak
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: meraki-flatpak
          path: release-assets
      - name: Attach Flatpak to the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.flatpak
