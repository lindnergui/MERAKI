name: Linux release packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package-deb:
    name: Build and package Debian artifact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev dpkg-dev
      - name: Build release bundle with Rust FFI library
        run: scripts/package-linux.sh --format deb
      - uses: actions/upload-artifact@v4
        with:
          name: meraki-deb
          path: dist/linux/*.deb

  package-rpm:
    name: Build and package Fedora artifact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build Rust, Flutter and .rpm in Fedora
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            fedora:42 \
            bash -lc '
              dnf install -y git curl unzip xz tar rpm-build clang cmake ninja-build pkgconf-pkg-config gtk3-devel liblzma-devel
              git clone --depth 1 --branch stable https://github.com/flutter/flutter.git /opt/flutter
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              export PATH="/opt/flutter/bin:/root/.cargo/bin:$PATH"
              flutter config --enable-linux-desktop
              scripts/package-linux.sh --format rpm
            '
      - uses: actions/upload-artifact@v4
        with:
          name: meraki-rpm
          path: dist/linux/*.rpm

  release:
    name: Publish GitHub Release
    needs: [package-deb, package-rpm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: meraki-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
